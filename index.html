const LAST_KEY = "ev_route_last_success_v2";



// Debug päälle URL:lla (?debug=1) TAI localStorage (iPhone/PWA)

let DEBUG_MODE = new URLSearchParams(location.search).get("debug") === "1";



// iPhone / PWA fallback (muistaa debug-tilan)

if (!DEBUG_MODE && localStorage.getItem("ev_debug") === "1") {

  DEBUG_MODE = true;

}



// jos debug aktivoitu URL:lla → tallennetaan se

/* ------------------ DEBUG ------------------ */

const elDebug = document.getElementById("debug");

function dbg(...args) {

  if (!DEBUG_MODE) return;



  const line = args.map(a => {

    if (typeof a === "string") return a;

    try { return JSON.stringify(a); } catch { return String(a); }

  }).join(" ");



  elDebug.textContent += line + "\n";

  elDebug.scrollTop = elDebug.scrollHeight;

}

window.addEventListener("error", (e) => dbg("JS ERROR:", e.message));

window.addEventListener("unhandledrejection", (e) => dbg("PROMISE ERROR:", String(e.reason)));



function debugTopPOIs(pois) {

  if (!Array.isArray(pois)) { dbg("DEBUG POI: pois is not an array"); return; }

  dbg("DEBUG POI: total returned =", String(pois.length));

  pois.slice(0, 10).forEach((p, i) => {

    const title = p?.AddressInfo?.Title || "(no title)";

    const operator = p?.OperatorInfo?.Title || "(unknown operator)";

    const conns = p?.Connections || [];

    const isDC = conns.some(c => Number(c?.LevelID) === 3 || String(c?.CurrentType?.Title || "").toUpperCase().includes("DC"));

    let maxPower = Math.max(...conns.map(c => Number(c?.PowerKW) || 0), 0);

    // Puuttuvaa lataustehoa ei arvata 50 kW:ksi.

    dbg(`#${i+1}`, "|", title, "| operator:", operator, "| maxPower:", String(maxPower), "| DC:", String(isDC));

}

/* ------------------ MAP ------------------ */

let map, layer;



function initMap() {

  const mapEl = document.getElementById("map");

  if (!mapEl) {

    dbg("MAP ERROR: #map element not found");

    return;

  }

  dbg("MAP element size:", mapEl.clientWidth + "x" + mapEl.clientHeight);

  const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {

    maxZoom: 18,

    attribution: "&copy; OpenStreetMap"

  }).addTo(map);

  tiles.on("tileerror", () => dbg("TILE ERROR"));

  layer = L.layerGroup().addTo(map);



  setTimeout(() => {

    try { map.invalidateSize(); dbg("invalidateSize OK"); }

    catch (e) { dbg("invalidateSize ERR", e?.message || String(e)); }

  }, 350);

}



function safeFitBounds() {

  try {

    const bounds = layer.getBounds?.();

    if (bounds && bounds.isValid && bounds.isValid()) map.fitBounds(bounds, { padding:[20,20] });

  } catch (e) { dbg("fitBounds error:", e?.message || String(e)); }

}



/* ------------------ HELPERS ------------------ */

function haversineKm(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const dLat = (lat2-lat1) * Math.PI/180;

  const dLon = (lon2-lon1) * Math.PI/180;

  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

}



async function geocode(name) {

  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(name);

  const r = await fetch(url);

  const j = await r.json();

  if (!j[0]) return null;

  return { lat: +j[0].lat, lon: +j[0].lon };

}



async function getStart() {

  return new Promise(resolve => {

    if (!navigator.geolocation) return resolve(null);

    navigator.geolocation.getCurrentPosition(

      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),

      () => resolve(null),

      { enableHighAccuracy: true, timeout: 8000 }

    );

  });

}



async function fetchRoute(start, end) {

  const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=geojson`;

  const r = await fetch(url);

  const j = await r.json();

  return j.routes[0].geometry.coordinates;

}



function pointAlongRoute(coords, km) {

  let acc = 0;

  for (let i=1;i<coords.length;i++) {

    const a = coords[i-1], b = coords[i];

    const d = haversineKm(a[1],a[0],b[1],b[0]);

    if (acc + d >= km) {

      const t = (km - acc)/d;

      return { lat: a[1] + (b[1]-a[1])*t, lon: a[0] + (b[0]-a[0])*t };

    }

    acc += d;

  }

  const last = coords.at(-1);

  return { lat:last[1], lon:last[0] };

}



// V1.18: haetaan asemia tasaisesti koko saavutettavan reittiosuuden varrelta.
function routeLengthKm(coords) {
  let total = 0;
  for (let i = 1; i < coords.length; i++) total += haversineKm(coords[i-1][1], coords[i-1][0], coords[i][1], coords[i][0]);
  return total;
}
function searchCentersAlongRoute(coords, usableKm) {
  const limit = Math.min(usableKm, routeLengthKm(coords));
  const distances = [0];
  for (let d = 40; d < limit; d += 40) distances.push(d);
  if (limit > 0 && limit - distances.at(-1) > 8) distances.push(limit);
  return distances.map(km => pointAlongRoute(coords, km));
}
// Etäisyys reittiviivasta (linnuntietä): estää kaukana sivuteillä olevia
// asemia syrjäyttämästä varsinaisen reitin latauspisteitä.
function kmFromRoute(station, coords) {
  let nearest = Infinity;
  for (let i = 0; i < coords.length; i += 3) {
    const c = coords[i];
    nearest = Math.min(nearest, haversineKm(station.lat, station.lon, c[1], c[0]));
  }
  const last = coords.at(-1);
  return Math.min(nearest, haversineKm(station.lat, station.lon, last[1], last[0]));
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }



async function fetchJsonWithTimeout(url, timeoutMs) {

  const controller = new AbortController();

  const t = setTimeout(() => controller.abort(), timeoutMs);



  try {

    const r = await fetch(url, {

      headers: { "Accept": "application/json" },

      cache: "no-store",

      signal: controller.signal

    });



    const text = await r.text();



    // Jos proxy / upstream palauttaa HTML:ää, kyse on lähes aina virhesivusta

    const s = text.trim().toLowerCase();

    const looksHtml = s.startsWith("<!doctype html") || s.startsWith("<html");

    if (looksHtml) {

      if (DEBUG_MODE) alert("OCM-haku epäonnistui – palvelu palautti HTML-virhesivun");

      console.error("OCM returned HTML instead of JSON", {

        status: r.status,

        url,

        body: text.slice(0, 1000)

      });

      const err = new Error("OCM returned HTML (likely proxy/upstream timeout)");

      err.status = 524;

      throw err;

    }



    // Yritä parsia JSON turvallisesti

    let json;

    try {

      json = JSON.parse(text);

    } catch (parseErr) {

      if (DEBUG_MODE) alert("OCM palautti virheellistä dataa (JSON parse failed)");

      console.error("Invalid JSON from proxy", {

        status: r.status,

        url,

        body: text.slice(0, 1000)

      });

      const err = new Error("Invalid JSON from proxy");

      err.status = r.status;

      throw err;

    }



    // HTTP-virhe

    if (!r.ok) {

      const msg = json?.error || ("HTTP " + r.status);

      if (DEBUG_MODE) alert("OCM-haku epäonnistui – tarkista Vercel/API");

      console.error("OCM HTTP error", {

        status: r.status,

        url,

        response: json

      });

      const err = new Error(msg);

      err.status = r.status;

      err.json = json;

      throw err;

    }



    // Proxy palautti JSON-muotoisen virheen vaikka HTTP-status olisi 200

    if (json && json.ok === false) {

      if (DEBUG_MODE) alert("OCM-proxy ilmoitti virheestä – tarkista Vercel/API");

      console.error("OCM proxy error payload", {

        status: r.status,

        url,

        response: json

      });

      const err = new Error(json.error || "OCM proxy error");

      err.status = r.status;

      err.json = json;

      throw err;

    }



    return json;

  } catch (e) {

    if (e.name === "AbortError") {

      if (DEBUG_MODE) alert("OCM-haku aikakatkaistiin");

      console.error("OCM request timeout", { url, timeoutMs });

      const err = new Error("OCM timeout");

      err.status = 524;

      throw err;

    }

    throw e;

  } finally {

    clearTimeout(t);

  }

}



async function fetchOCM(lat, lon, km, maxresults = 25) {

  const p = new URLSearchParams({

    latitude: String(lat),

    longitude: String(lon),

    distance: String(km),

    distanceunit: "KM",

    maxresults: String(maxresults)

  });

  const url = OCM_PROXY_BASE + "?" + p.toString();

  dbg("OCM URL:", url);



  let lastErr = null;

  for (let i = 1; i <= 3; i++) {

    try { return await fetchJsonWithTimeout(url, 18000); }

    catch (e) {

      lastErr = e;

      dbg("OCM try failed:", String(e?.message || e), "status:", e?.status || "");

      if (i < 3) await sleep(500 * i);

    }

  }

  throw lastErr;

}

// Tariff IDs live on connectors. Use IDs, never a name/coordinate heuristic.
function abcTariffIds(properties) {
  return [...new Set((properties.evses || []).flatMap(e => e.connectors || [])
    .filter(c => String(c.powerType || '').toUpperCase() === 'DC')
    .flatMap(c => Array.isArray(c.tariffIds) ? c.tariffIds : []))];
}
function abcEnergyPrice(tariff) {
  if (!tariff || tariff.currency !== 'EUR') return null;
  // One unambiguous unconditional energy component is required.
  const elements = (tariff.elements || []).filter(e =>
    (e.priceComponents || []).some(c => c.type === 'ENERGY'));
  if (elements.length !== 1 || elements[0].restrictions) return null;
  const component = elements[0].priceComponents.filter(c => c.type === 'ENERGY');
  if (component.length !== 1 || !Number.isFinite(Number(component[0].price))) return null;
  const taxStatus = tariff.taxIncluded;
  if (taxStatus !== 'YES' && taxStatus !== 'NO') return null;
  const vat = Number(component[0].vat);
  if (taxStatus === 'NO' && !Number.isFinite(vat)) return null;
  return Number(component[0].price) * (taxStatus === 'NO' ? 1 + vat / 100 : 1);
}
function attachABCTariffs(stations, tariffs) {
  const byId = new Map(tariffs.map(t => [String(t.id), t]));
  for (const station of stations) {
    const ids = station.tariffIds || [];
    const prices = ids.map(id => byId.get(String(id))).filter(Boolean)
      .map(t => ({ value: abcEnergyPrice(t), tariff: t }));
    // Do not show an ambiguous price for stations with multiple differing tariffs.
    if (prices.length !== ids.length || !prices.length ||
        prices.some(p => p.value === null || Math.abs(p.value - prices[0].value) > 0.0001)) continue;
    station.energyPrice = prices[0].value;
    station.priceUpdated = prices.map(p => p.tariff.lastUpdated).filter(Boolean).sort()[0] || null;
    station.priceNote = 'Digitraffic / AD_HOC_PAYMENT; mahdolliset aikamaksut erikseen';
  }
}
function energyPriceDisplay(station) {
  if (station.operator !== 'ABC' || station.source !== 'Digitraffic') return 'Hintaa ei saatavilla';
  if (!Number.isFinite(station.energyPrice)) return 'Hintaa ei saatavilla';
  return new Intl.NumberFormat('fi-FI', {minimumFractionDigits: 2, maximumFractionDigits: 2})
    .format(station.energyPrice) + ' €/kWh (sis. ALV)';
}

/* ------------------ ABC / DIGITRAFFIC ------------------ */

function isABC(operator, title) {

  return /\babc\b/i.test(String(operator || "") + " " + String(title || ""));

}

async function fetchABCDigitraffic(target, radiusKm, sharedJson = null) {

  const json = sharedJson || await fetchJsonWithTimeout(ABC_AFIR_URL, 20000);

  if (!Array.isArray(json?.features)) throw new Error("Digitraffic: asemalista puuttuu");

  // Rajapinnan GeoJSON: koordinaattijärjestys [pituusaste, leveysaste].

  const mapped = json.features.map(f => {

    const p = f.properties || {};

    const coords = f.geometry?.coordinates;

    const lon = Number(coords?.[0]);

    const lat = Number(coords?.[1]);

    if (!Array.isArray(coords) || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;

    const dcPowers = (p.evses || []).flatMap(e => (e.connectors || []))

      .filter(c => String(c.powerType || "").toUpperCase() === "DC")

      .map(c => Number(c.maxElectricPower) / 1000)

      .filter(n => Number.isFinite(n) && n > 0);

    const hasDC = (p.evses || []).some(e => (e.connectors || [])

      .some(c => String(c.powerType || "").toUpperCase() === "DC"));

    if (!hasDC) return null;

    const dist = haversineKm(target.lat, target.lon, lat, lon);

    if (dist > radiusKm) return null;

    const a = p.address || {};

    return { title: p.name || [a.street, a.city].filter(Boolean).join(", ") || "ABC-lataus",

      lat, lon, maxPower: Math.max(0, ...dcPowers), isDC: true,

      operator: "ABC", dist, source: "Digitraffic",
      tariffIds: abcTariffIds(p),
      address: [a.street, a.city].filter(Boolean).join(", ") };

  }).filter(Boolean);

  dbg("ABC Digitraffic stations in radius:", mapped.length);

  return mapped;

}

// Tyhjä kenttä tarkoittaa kaikkia operaattoreita; Suosikit palauttaa viisi.

function parseOperatorAllowlist() {

  const raw = (elOperatorFilter?.value || "").trim();

  return raw ? raw.split(",").map(s => s.trim()).filter(Boolean) : [];

}

function operatorMatches(allow, opTitle, stationTitle) {

  if (!allow.length) return true;

  const operator = String(opTitle || "").toLowerCase();

  const title = String(stationTitle || "").toLowerCase();

  const has = re => re.test(operator) || re.test(title);

  return allow.some(name => {

    switch (name.toLowerCase()) {

      case "abc": return has(/\babc(?:[ -]lataus)?\b/);

      case "k-lataus": return has(/k[ -]?lataus|k[ -]?charge/);

      case "st1": return has(/\bst1\b/);

      case "neste": return has(/\bneste\b/);

      case "faast": return has(/\bfaast\b/);

      default: return (operator + " " + title).includes(name.toLowerCase());

    }

  });

}

// Tieverkkoon perustuvat etäisyydet OSRM:n ajomatkamatriisista.

// Näytetään tulos vain, jos palvelu palauttaa kelvollisen reitin.

async function enrichRoadDistances(start, end, results) {

  if (!results.length) return results;

  const coords = [start, ...results.map(r => ({lat:r.lat, lon:r.lon})), end];

  const points = coords.map(p => `${p.lon},${p.lat}`).join(";");

  const url = `https://router.project-osrm.org/table/v1/driving/${points}?annotations=distance`;

  try {

    const response = await fetchJsonWithTimeout(url, 14000);

    if (response.code !== "Ok" || !Array.isArray(response.distances)) throw new Error("OSRM table unavailable");

    const d = response.distances;

    const last = coords.length - 1;

    const base = d[0]?.[last];

    return results.map((r, i) => {

      const toStation = d[0]?.[i + 1];

      const onward = d[i + 1]?.[last];

      const valid = Number.isFinite(toStation) && Number.isFinite(onward) && Number.isFinite(base);

      return {...r,

        roadKm: valid ? toStation / 1000 : null,

        detourKm: valid ? Math.max(0, (toStation + onward - base) / 1000) : null

      };

    });

  } catch (e) {

    dbg("Road distance unavailable:", String(e));

    return results.map(r => ({...r, roadKm:null, detourKm:null}));

  }

}



// V1.15: tarkista poikkeama varsinaisella OSRM-reitillä (ei pelkällä matriisilla).

// Matriisin 0 km -tulos voi syntyä, vaikka asema olisi eri valtatien varrella.

async function exactRouteDistanceKm(points) {

  const path = points.map(p => `${p.lon},${p.lat}`).join(";");

  const url = `https://router.project-osrm.org/route/v1/driving/${path}?overview=false&steps=false`;

  const data = await fetchJsonWithTimeout(url, 14000);

  const meters = data?.routes?.[0]?.distance;

  if (data?.code !== "Ok" || !Number.isFinite(meters)) throw new Error("Tarkkaa reittiä ei löytynyt");

  return meters / 1000;

}



async function verifyDetours(start, end, results) {

  let baseKm;

  try { baseKm = await exactRouteDistanceKm([start, end]); }

  catch (e) {

    dbg("Tarkka perusreitti ei saatavilla:", String(e));

    return results.map(r => ({...r, detourKm:null, detourVerified:false}));

  }

  // Rajattu samanaikaisuus, jotta julkista reitityspalvelua ei kuormiteta.

  const out = [];

  for (let i=0; i<results.length; i+=3) {

    const batch = results.slice(i,i+3);

    const verified = await Promise.all(batch.map(async r => {

      try {

        const viaKm = await exactRouteDistanceKm([start, {lat:r.lat,lon:r.lon}, end]);

        const difference = viaKm - baseKm;

        // Pienet pyöristys- ja reititysheitot ovat mahdollisia; iso negatiivinen

        // erotus tarkoittaa ristiriitaa eikä sitä saa merkitä 0,0 km:ksi.

        if (difference < -0.15) throw new Error("Reittien etäisyydet ristiriidassa");

        return {...r, detourKm:Math.max(0,difference), detourVerified:true};

      } catch(e) {

        dbg("Lisämatkaa ei voitu varmistaa:", r.name || r.title || "asema", String(e));

        return {...r, detourKm:null, detourVerified:false};

      }

    }));

    out.push(...verified);

  }

  return out;

}

function chargingStationSearchUrl(station) {
  const title = String(station.title || "").trim();
  const address = String(station.address || "").trim();
  const operator = String(station.operator || "").trim();
  // ABC:n liikenneasema ja latauskohde ovat Google Mapsissa eri paikkoja.
  // Tämä Renkomäen latauskohde vahvistettiin iPhonessa ja Volvo EX30:ssa.
  if ((operator.toUpperCase() === "ABC" || /\bABC\b/i.test(title)) &&
      /renkomäki/i.test(title + " " + address) && /lahti/i.test(title + " " + address)) {
    return "https://maps.app.goo.gl/Vkg9qwCxPwA4buc69";
  }
  // Muilla ABC-asemilla haetaan lataustoimipistettä, ei samannimistä huoltoasemaa.
  // Tämä on haku, ei varmistettu Places-kohdetunniste: tarkista Google Mapsin luokitus.
  const abc = operator.toUpperCase() === "ABC" || /\bABC\b/i.test(title);
  const query = abc
    ? ["ABC-Lataus", address || title].filter(Boolean).join(" ")
    : [operator || title, "sähköauton latausasema", address].filter(Boolean).join(" ");
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

function mapPoisToResults(pois, target, allowOps, abcResults = null) {

  const mapped = (pois || []).map(p => {

    const ai = p.AddressInfo || {};

    const conns = p.Connections || [];



    const isDC = conns.some(c =>

      Number(c.LevelID) === 3 ||

      String(c.CurrentType?.Title || "").toUpperCase().includes("DC")

    );



    let maxPower = Math.max(...conns.map(c => Number(c.PowerKW) || 0), 0);

    // Puuttuvaa lataustehoa ei arvata 50 kW:ksi.



    const operator = p.OperatorInfo?.Title || "";

    return {

      title: ai.Title || "Nimetön latauspaikka",

      lat: Number(ai.Latitude),

      lon: Number(ai.Longitude),

      maxPower,

      isDC,

      operator,

      address: [ai.AddressLine1, ai.Town, ai.StateOrProvince].filter(Boolean).join(", "),

      dist: haversineKm(target.lat, target.lon, Number(ai.Latitude), Number(ai.Longitude))

    };

  }).filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lon) && x.isDC);



  // Kun AFIR toimii, ABC tulee vain sieltä; ei vanhentuneita OCM-kopioita.

  const combined = abcResults === null ? mapped : [

    ...mapped.filter(x => !isABC(x.operator, x.title)), ...abcResults

  ];

  const filteredByOp = combined.filter(x => operatorMatches(allowOps, x.operator, x.title));

  const fast = filteredByOp.filter(x => x.maxPower >= 150);

  const final = (fast.length ? fast : filteredByOp)

    .sort((a,b)=>(b.maxPower-a.maxPower)||(a.dist-b.dist))

    .slice(0,60); // Ehdokkaat eri puolilta reittiä; ajomatkat ratkaisevat lopullisen valinnan.



  return { mapped: combined, filteredByOp, fastCount: fast.length, final };

}

  if (last.results) {

    renderResults(last.results, " (viimeisin onnistunut)", last.usableKm);

    requestAnimationFrame(() => requestAnimationFrame(() => fitChargingArea()));

  }

  else setStatus("Tallennettu tulos oli puutteellinen.", "warn");

}



/* ------------------ MAIN ------------------ */

async function runSearch() {

  clearUIForSearch();

  setBusy(true);



  const toName = elTo.value.trim();

  if (!toName) { setBusy(false); return setStatus("Anna määränpää.", "warn"); }



  const usableKm = Math.max(0, Number(elRange.value) - Number(elReserve.value));

  if (usableKm <= 0) { setBusy(false); return setStatus("Akkua − vara = 0 km. Pienennä varaa tai nosta akkua.", "warn"); }



  try {

    setStatus("Haetaan lähtö ja määränpää…");



    // Käyttäjän kirjoittama lähtöpaikka on ensisijainen. GPS vain tyhjällä kentällä.

    const fromName = elFrom.value.trim();

    let start = fromName ? await geocode(fromName) : await getStart();

    if (!start) {

      setBusy(false);

      return setStatus(fromName ? "Lähtöpaikkaa ei löytynyt. Tarkista kirjoitusasu." : "GPS ei käytettävissä – anna lähtökaupunki.", "warn");

    }



    const end = await geocode(toName);

    if (!end) { setBusy(false); return setStatus("Määränpäätä ei löytynyt. Tarkista kirjoitusasu (esim. Turku).", "warn"); }



    setStatus("Haetaan reitti…");

    const route = await fetchRoute(start, end);

    currentRouteBounds = L.latLngBounds(route.map(([lon, lat]) => [lat, lon]));



    L.geoJSON({ type:"LineString", coordinates: route }, { color:"#2563eb", weight:4 }).addTo(layer);



    const target = pointAlongRoute(route, usableKm);

    L.circleMarker([target.lat, target.lon], { radius:8, color:"#f59e0b", fillOpacity:0.9 })

      .addTo(layer).bindPopup(`<b>Seuraava lataus</b><br>${usableKm.toFixed(0)} km`);



    setTimeout(() => map.invalidateSize(), 50);

    currentChargingBounds = L.latLngBounds([[start.lat, start.lon], [target.lat, target.lon]]);

    // Rajataan näkymä lähtöpisteeseen ja lataustavoitteeseen.

    // Koko reitin geometrian lisääminen tähän saattoi zoomata kartan liian kauas.



    showMapControls();

    fitChargingArea();



    setStatus("Haetaan latauspisteet…");



    const allowOps = parseOperatorAllowlist();

    const radiusKm = Number(elRadius.value);



    // Kolme hakualuetta reitin varrelta: aikaisemmat pysähdykset ja viimeinen latauskohta.

    // Yksi OCM-haku per alue; ABC:n koko aineisto haetaan vain kerran.

    const fractions = [0.75, 0.87, 1];

    const centers = fractions.map(f => pointAlongRoute(route, usableKm * f));

    const allPois = [];

    let successfulOCM = 0;

    for (let i = 0; i < centers.length; i++) {

      setStatus(`Haetaan latausasemia reitin varrelta (${i + 1}/${centers.length})…`);

      const center = centers[i];

      try {

        const items = await fetchOCM(center.lat, center.lon, radiusKm, 75);

        if (Array.isArray(items)) { allPois.push(...items); successfulOCM++; }

      } catch (e) {

        dbg("OCM area failed:", i, String(e));

      }

    }

    let abcResults = null;

    try {

      setStatus("Haetaan ABC-asemat Digitrafficista…");

      const abcJson = await fetchJsonWithTimeout(ABC_AFIR_URL, 20000);

      const abcById = new Map();

      for (const center of centers) {

        const stations = await fetchABCDigitraffic(center, radiusKm, abcJson);

        for (const station of stations) abcById.set(`${station.lat.toFixed(5)},${station.lon.toFixed(5)}`, station);

      }

      abcResults = [...abcById.values()];
      // Optional enrichment: a tariff service failure must never block route results.
      try {
        const tariffJson = await fetchJsonWithTimeout(ABC_TARIFF_URL, 15000);
        const tariffs = Array.isArray(tariffJson?.tariffs) ? tariffJson.tariffs : [];
        attachABCTariffs(abcResults, tariffs);
        dbg('ABC prices resolved:', abcResults.filter(s => Number.isFinite(s.energyPrice)).length);
      } catch (priceError) {
        dbg('ABC tariffs unavailable; stations still shown:', String(priceError));
      }

    } catch (e) {

      dbg("ABC Digitraffic unavailable:", String(e));

    }

    if (!successfulOCM && abcResults === null) throw new Error("Latausasemien tietolähteet eivät vastanneet");

    const poisById = new Map();

    for (const poi of allPois) {

      const id = poi.ID ?? `${poi.AddressInfo?.Latitude},${poi.AddressInfo?.Longitude},${poi.AddressInfo?.Title}`;

      poisById.set(id, poi);

    }

    const pois = [...poisById.values()];

    const stationData = mapPoisToResults(pois, target, allowOps, abcResults);
    const { mapped, filteredByOp, fastCount } = stationData;
    // Kartoitetaan etäisyys reittiviivasta ennen raskaita OSRM-kyselyjä.
    // 20 km käytävä sallii lähellä olevat liittymät, mutta jättää kaukaiset sivutiet pois.
    const final = filteredByOp
      .map(r => ({...r, corridorKm: kmFromRoute(r, route)}))
      .filter(r => r.corridorKm <= 20)
      .sort((a,b) => a.corridorKm-b.corridorKm || b.maxPower-a.maxPower)
      .slice(0,60);
    dbg("Löydetyt, suodatetut ja reittikäytävässä:", mapped.length, filteredByOp.length, final.length);



    if (!mapped.length) {

      setBusy(false);

      setStatus("Ei löytynyt DC-latureita tällä haulla. Kokeile isompaa hakusädettä.", "warn");

      showFallbackActions(!!loadLast());

      return;

    }



    if (allowOps.length && !filteredByOp.length) {

      setBusy(false);

      setStatus("Operaattorisuodatus poisti kaikki tulokset. Laajenna listaa tai tyhjennä suodatin.", "warn");

      showFallbackActions(!!loadLast());

      return;

    }



    if (!final.length) {

      setBusy(false);

      setStatus("Ei löytynyt sopivia latauspaikkoja tällä haulla. Kokeile isompaa hakusädettä.", "warn");

      showFallbackActions(!!loadLast());

      return;

    }



    setStatus("Lasketaan ajomatkat tieverkkoa pitkin…");

    // OSRM:n matriisi pidetään kohtuullisena; jaetaan ehdokkaat pieniin eriin.

    const roadResults = [];

    for (let i = 0; i < final.length; i += 12) {

      roadResults.push(...await enrichRoadDistances(start, end, final.slice(i, i + 12)));

    }

    setStatus("Tarkistetaan lisämatkat latausasemien kautta…");

    const verifiedResults = await verifyDetours(start, end, roadResults);

    const checked = verifiedResults.map(r => ({...r, rangeStatus: !Number.isFinite(r.roadKm) ? "unknown" : r.roadKm <= usableKm ? "within" : "outside", shortfallKm: Number.isFinite(r.roadKm) ? Math.max(0, r.roadKm - usableKm) : null}));

    // Vain kohtuullisella lisämatkalla olevat ehdokkaat varsinaisiin suosituksiin.
    // Jos OSRM ei vahvista lisämatkaa, asema jää erilliseksi epävarmaksi vaihtoehdoksi.
    const sensible = checked.filter(r => r.detourVerified && Number.isFinite(r.detourKm) && r.detourKm <= 20);
    const reachable = sensible.filter(r => r.rangeStatus === "within").sort((a,b) => b.roadKm-a.roadKm || b.maxPower-a.maxPower);
    const others = checked.filter(r => !sensible.includes(r) || r.rangeStatus !== "within")
      .sort((a,b) => (a.detourKm ?? Infinity)-(b.detourKm ?? Infinity) || (a.roadKm ?? Infinity)-(b.roadKm ?? Infinity));

    // Kolme lähellä tavoitekohtaa ja kaksi aikaisempaa vaihtoehtoa.

    // V1.15: lähellä latausrajaa olevat ehdokkaat: poikkeama reitiltä

    // ratkaisee ensisijaisesti, mutta liian aikainen lataus saa haittapisteitä.

    // Vertailu tehdään vain saavutettavissa olevien asemien kesken.

    const recommendationScore = r => {

      const earlyKm = Math.max(0, usableKm - r.roadKm);

      const detour = Number.isFinite(r.detourKm) ? Math.max(0, r.detourKm) : 100;

      const powerBonus = r.maxPower > 0 ? Math.min(r.maxPower, 400) / 400 : 0;

      return detour * 2 + earlyKm * 0.25 - powerBonus * 0.5;

    };

    const nearTarget = [...reachable].sort((a,b) => recommendationScore(a)-recommendationScore(b)).slice(0,5);
    // Näytetään myös aiemmat, reitille hyvin sopivat latauspaikat; ne eivät
    // saa pudota pois vain siksi, että ovat kauempana latausrajasta.
    const early = reachable.filter(r => !nearTarget.includes(r))
      .sort((a,b) => a.detourKm-b.detourKm || b.maxPower-a.maxPower).slice(0,5);
    const shown = [
      ...nearTarget.map(r => ({...r, resultGroup:"recommended"})),
      ...early.map(r => ({...r, resultGroup:"early"})),
      ...others.slice(0,3).map(r => ({...r, resultGroup:"outside"}))
    ];

    saveLast({ route, target, usableKm, results: shown, savedAt: Date.now() });



    const suffix =

      (final.length < 5 ? ` (näytetään ${final.length}/5 – kokeile isompaa hakusädettä)` : "") +

      (fastCount ? "" : " (ei ≥150 kW osumia – näytetään parhaat DC-laturit)");



    renderResults(shown, ` (reitin varrella ja toimintamatkan sisällä ${reachable.length}, muut/varmistamattomat ${others.length}; mukana myös aikaisempia asemia)` + (abcResults === null ? " (ABC: OCM-varatiedot)" : " (ABC: Digitraffic)"), usableKm);

    // Siirry mobiilissa tuloksiin vasta uuden haun valmistuttua.

    if (window.matchMedia("(max-width: 600px)").matches) {

      requestAnimationFrame(() => {

        const heading = elList.querySelector(".result-group-title");

        if (heading) heading.scrollIntoView({behavior:"smooth",block:"start"});

      });

    }

    setBusy(false);

    // Sovita kartta vasta tuloskorttien valmistuttua, jolloin latausvaihe

    // tai kartan koon päivitys ei enää muuta käyttäjän näkemää zoomausta.

    requestAnimationFrame(() => requestAnimationFrame(() => fitChargingArea()));



  } catch (e) {

    console.error(e);

    dbg("CATCH:", e?.message || String(e), "status:", e?.status || "");

    showRetry(true);

    showFallbackActions(!!loadLast());



    const msg = String(e?.message || e);

    if (msg.toLowerCase().includes("ocm") || e?.status === 524 || e?.status === 503 || e?.status === 504) {

      setStatus("OCM ei vastannut nyt (ruuhka/timeout). Yritä uudelleen hetken päästä.", "error");

    } else if (e?.status === 401 || e?.status === 403) {

      setStatus("OCM/Vercel hylkäsi pyynnön. Tarkista Vercel-tili, API-avain ja projektin asetukset.", "error");

    } else if (e?.status >= 500) {

      setStatus("Palvelinvirhe lataushaussa. Tarkista Vercel/API.", "error");

    } else {

      setStatus("Haku epäonnistui: " + msg, "error");

    }



    setBusy(false);

  }

}

document.getElementById("btnRetry").onclick = runSearch;
